name: Test and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node --test test/core.test.mjs test/importers.test.mjs test/limits.test.mjs
  deploy:
    # Pages isn't enabled on this repo yet. After Settings -> Pages -> Source "GitHub Actions",
    # add repo variable PAGES_ENABLED=true (Settings -> Secrets and variables -> Actions -> Variables).
    if: vars.PAGES_ENABLED == 'true'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
